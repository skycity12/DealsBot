# DRAFT FOR REVIEW ONLY - NOT ACTIVE (lives in docs/, not .github/workflows/).
# The ONLY differences from the current .github/workflows/track.yml are marked "CHANGED".
# Schedule, secrets and concurrency are identical. If you approve, copy this file
# over .github/workflows/track.yml yourself.
name: Amazon Deal Scanner

on:
  schedule:
    - cron: "*/30 * * * *"   # unchanged. The weekly job does NOT need its own cron:
                             # scanner.py checks Africa/Cairo time itself (zoneinfo),
                             # so daylight saving is automatic and no UTC conversion
                             # is baked in. Runs may be delayed by GitHub; the job has
                             # a catch-up window (weekly.catch_up_hours) for that.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan amazon.eg for crazy deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -u scanner.py          # CHANGED: -u so logs appear live
      - name: Save memory of posted deals (seen.json + bot state)
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          # CHANGED: also persist the bot state files (they only exist when written).
          # Without this, candidates / message ids / poll state are lost between runs.
          git add seen.json 2>/dev/null || true
          for f in bot_state.json bot_state.dryrun.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --staged --quiet; then echo "memory unchanged"; exit 0; fi
          git commit -m "update memory of posted deals"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "memory saved to repository"; exit 0
            fi
            echo "push failed, retry $i"; sleep 5
          done
          echo "FAILED to save memory - duplicates may be posted next run"
          exit 1
