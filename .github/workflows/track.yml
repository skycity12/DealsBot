name: Amazon Deal Scanner

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay/skip some)
  workflow_dispatch:         # manual run button (also used by cron-job.org)

permissions:
  contents: write

concurrency:
  group: deal-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan amazon.eg for crazy deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scanner.py
      - name: Save memory of posted deals (seen.json)
        if: always()
        run: |
          if [ ! -f seen.json ]; then echo "no seen.json yet"; exit 0; fi
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          if git diff --staged --quiet; then echo "memory unchanged"; exit 0; fi
          git commit -m "update memory of posted deals"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "memory saved to repository"; exit 0
            fi
            echo "push failed, retry $i"; sleep 5
          done
          echo "FAILED to save memory - duplicates may be posted next run"
          exit 1
